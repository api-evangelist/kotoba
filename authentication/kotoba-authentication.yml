  - openapi/kotoba-tts-realtime-openapi-original.yml
- name: httpBasic
  type: http
  scheme: basic
  description: |-
    HTTP Basic authentication. Set device_id as the username and api_key
    as the password. Send it via the Authorization header during the
    WebSocket handshake.
  sources:
