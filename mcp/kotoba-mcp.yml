notes: 'Kotoba publishes a real, live, remote MCP server for its documentation, advertised in llms.txt
  and in the header of every docs markdown page ("For AI client integration (Claude Code, Cursor, etc.),
  connect to the MCP server at https://docs.kotoba.tech/_mcp/server"). It is the Fern docs MCP server
  (serverInfo.name = fern-docs-mcp-server, v1.0.0), so it exposes documentation search only — it does
  NOT expose the ASR / STS / TTS / transcription operations as callable tools. Verified live: an `initialize`
  handshake returned protocolVersion 2025-06-18 with tools.listChanged, and `tools/list` returned a single
  tool.'
server:
  name: kotoba-docs
  transport: http
  url: https://docs.kotoba.tech/_mcp/server
  protocol_version: '2025-06-18'
  implementation: fern-docs-mcp-server
  implementation_version: 1.0.0
  auth: none
  scope: documentation
  verified: '2026-07-19'
