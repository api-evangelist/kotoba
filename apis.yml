aid: kotoba
name: Kotoba
description: >-
  Kotoba Technologies is a Japan-founded frontier voice AI company building a
  foundational real-time speech model and simultaneous translation technology.
  Its developer platform exposes three JSON-over-WebSocket realtime capabilities
  — ASR (automatic speech recognition with live transcript deltas), STS
  (speech-to-speech translation that emits both a source transcript and
  synthesized target-language audio over one connection), and TTS (streaming
  text-to-speech) — alongside a REST transcription API for batch and offline
  workflows built on a submit-and-poll job model. Supported languages span
  English, Japanese, Korean, Chinese and Spanish. Each realtime channel is
  described by a published AsyncAPI 2.6.0 document and each REST surface by
  OpenAPI 3.1, with a first-party Python SDK, an llms.txt agent index, and a
  live remote MCP documentation server. The APIs are in private alpha, available
  to selected customers on request.
