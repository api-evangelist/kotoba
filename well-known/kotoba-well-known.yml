generated: '2026-07-19'
method: searched
source: live probes of the Kotoba web, docs, and API hosts
notes: >-
  No /.well-known/ discovery documents are published on any Kotoba host. The
  marketing site (kotoba.tech -> site.kotoba.tech) is a Framer site that serves
  a 200 HTML catch-all for every unknown path, so a naive probe reports a false
  200 for /.well-known/security.txt and /llms.txt; both were fetched and
  confirmed to be the site's HTML shell, not the requested document, and are
  recorded below as not-found. The production API host api.kotobatech.ai returns
  503 for every path because the API is in private alpha and gated to selected
  customers.
