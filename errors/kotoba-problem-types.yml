notes: >-
  Kotoba does NOT use RFC 9457 problem+json. Two distinct error envelopes exist:
  (1) the batch REST transcription API returns a FastAPI-style
  `HTTPValidationError` on 422, and encodes terminal job failure in a 200 body
  via a `state` discriminator rather than an HTTP status; (2) each realtime
  WebSocket channel emits a bespoke `error` event frame. Kotoba publishes no
  enumerated error-code registry, so no `errors/kotoba-error-codes.yml` sibling
  is asserted — the TTS `code` field is a free-form string in the spec.
