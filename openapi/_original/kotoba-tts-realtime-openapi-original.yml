openapi: 3.1.0
info:
  title: Live (WebSocket)
  version: 1.0.0
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer-token authentication. Send the API key in the
        `Authorization: Bearer <api_key>` header during the WebSocket
        handshake.
